name: Test

on:
  push:
    branches: [main]
  pull_request:

# Deploys are done by Cloudflare Workers Builds, connected to this repo; this only runs the tests.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

